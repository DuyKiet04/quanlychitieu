<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051917"/>
      <stop offset="45%" stop-color="#0E3834"/>
      <stop offset="100%" stop-color="#1A5E57"/>
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient -->
    <linearGradient id="mintGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Inner Radial Specular Glow -->
    <radialGradient id="specularGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2DA87B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Spark Gradient -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadow for Monogram -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020E0D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- iOS / Squircle Card Shape with Radius 112 (Standard 512x512 app icon corner) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#specularGlow)"/>
  
  <!-- Subtle Outer Hairline Border -->
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Geometric Luxury Ring / Vault Arc -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.18" stroke-dasharray="8 12"/>

  <!-- Monogram Logo Container with Drop Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Stylized "F" & "M" Architectural Emblem -->
    <!-- Stem Left (F & M Left Pillar) -->
    <path d="M148 144 H188 V368 H148 Z" fill="url(#mintGoldGrad)" rx="8"/>
    
    <!-- F Top Bar -->
    <path d="M188 144 H348 C358 144 364 154 360 164 L350 186 C347 192 341 196 334 196 H188 V144 Z" fill="url(#mintGoldGrad)"/>
    
    <!-- F Middle Bar connecting into M Diagonal -->
    <path d="M188 232 H300 C308 232 314 239 312 247 L304 266 C302 271 297 274 291 274 H188 V232 Z" fill="url(#mintGoldGrad)"/>

    <!-- Dynamic M Peak & Right Wing -->
    <!-- Central Valley Chevron -->
    <path d="M228 176 L284 290 C289 300 303 300 308 290 L364 176 C369 166 362 154 350 154 H336 C328 154 321 159 317 167 L296 216 L275 167 C271 159 264 154 256 154 H242 C230 154 223 166 228 176 Z" fill="#E8F7F0"/>

    <!-- Stem Right (M Right Pillar) -->
    <path d="M324 212 H364 V368 H324 Z" fill="url(#mintGoldGrad)" rx="8"/>

    <!-- Rising Financial Indicator Trendline (Quiet Luxury Touch) -->
    <path d="M164 336 L240 286 L292 312 L388 236" fill="none" stroke="url(#goldSpark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Trendline Apex Bull Diamond -->
    <polygon points="388,224 398,236 388,248 378,236" fill="url(#goldSpark)"/>
  </g>

  <!-- Luxury Diamond Spark on Top Corner -->
  <g transform="translate(382, 110)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="url(#goldSpark)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFBEB"/>
  </g>
</svg>

